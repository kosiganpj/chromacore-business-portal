spring.application.name=chromacore-portal
server.port=${PORT:8080}

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chromacore}
spring.datasource.username=${DB_USERNAME:chromacore}
spring.datasource.password=${DB_PASSWORD:chromacore}

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =========================================================
# JWT
# =========================================================

app.jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =========================================================
# EMAIL
# =========================================================

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM:no-reply@chromacore.local}

# =========================================================
# WHATSAPP
# =========================================================

app.whatsapp.token=${WHATSAPP_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.graph-version=${WHATSAPP_GRAPH_VERSION:v23.0}

# =========================================================
# SPRING SECURITY
# =========================================================

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration